name: Feature idea
description: Suggest an improvement to the game.
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would make the game more enjoyable or easier to use?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What problem would this solve?
  - type: textarea
    id: details
    attributes:
      label: Examples or details
