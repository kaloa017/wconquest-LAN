name: Project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DISABLE_SCHEDULER: '1'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Check Raspberry Pi installer syntax
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/raspberry-pi/install.sh
          bash -n deploy/raspberry-pi/set-tunnel-token.sh
          bash -n deploy/raspberry-pi/set-email.sh
      - name: Install offline UI test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check publishable files
        run: python tools/check_release.py
      - name: Check browser script syntax
        run: |
          node --check static/client.js
          node --check static/legacy-client.js
          node --check static/expansion.js
          node --check static/economy.js
          node --check static/progression.js
          node --check static/activity.js
          node --check static/advertisements.js
          node --check static/playtime.js
          node --check static/experience.js
          node --check static/interface.js
          node --check static/map-performance.js
          node --check static/community-upgrades.js
          node --check static/research-upgrades.js
          node --check static/admin-dashboard.js
          node --check static/game-polish.js
          node --check static/communications.js
          node --check static/product-ui.js
          node --check static/cities.js
          node --check static/player-events.js
          node --check static/guided-help.js
          node tests/client_audit.cjs
      - name: Test interface in offline DOMs
        run: npm run test:ui
      - name: Test isolated game databases
        run: python -m unittest discover -s tests -v
